:root{color-scheme:light dark;--bg:#faf7f2;--paper:#fff;--ink:#25241f;--muted:#706c65;--line:#e6e0d8;--accent:#a83f33;--on:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.logo{background:var(--accent);color:white;border-radius:14px;padding:8px 13px;font-size:27px}h1{font-size:25px;margin:0}p{color:var(--muted);line-height:1.5;margin:6px 0 14px}nav,.actions{display:flex;gap:8px;margin:14px 0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--paper);color:var(--ink);min-height:44px}button:disabled{opacity:.45;cursor:default}nav button,.actions button{flex:1}button.active,button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}.card{width:100%;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 14px;overflow-wrap:anywhere}.card span{color:var(--muted);font-size:13px}.card strong{font-size:clamp(24px,7vw,42px);white-space:pre-wrap;font-weight:500;line-height:1.4}textarea{width:100%;resize:vertical;min-height:100px;padding:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;margin:8px 0 16px}label{display:block;font-weight:600}.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.item strong,.item p{white-space:pre-wrap}.item button{margin-right:8px}.small{font-size:13px;color:var(--muted)}.wide{width:100%}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#171716;--paper:#222221;--ink:#f5f1e9;--muted:#b8b2a8;--line:#3b3936;--accent:#b84e41}}

</style></head><body><main><header><div class="logo" lang="zh">汉</div><div><h1>Hanzi</h1><div class="small">Dein persönlicher Vokabeltrainer</div></div></header><div id="status" role="status" class="small"></div><section id="learn" aria-label="Lernen"><div class="learn-toolbar"><p id="progress" aria-live="polite"></p><button id="shuffle" class="icon-button" aria-label="Zufällige Reihenfolge" aria-pressed="false" title="Zufällige Reihenfolge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h3c4 0 6 12 10 12h5m-4-4 4 4-4 4M3 18h3c1.7 0 3-2.3 4.2-5M14 8c.7-1.2 1.4-2 3-2h4m-4-4 4 4-4 4"/></svg></button></div><div id="stage" class="stage"><button id="card" class="card" aria-label="Karte umdrehen"><strong id="word" lang="zh"></strong></button><div id="feedback" class="feedback" aria-hidden="true"><svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path id="feedback-path" d="M30 60l20 20 40-40"/></svg></div><span id="result" class="sr-only" role="status"></span></div><p id="hint" class="learn-hint">Tippen zum Umdrehen · Wischen zum Lernen</p><button id="empty" class="primary wide" hidden>Erste Karte erstellen</button></section><section id="add" hidden><h2 id="formtitle">Neue Lernkarte</h2><form id="form"><label for="front">Vorderseite</label><textarea id="front" placeholder="你好" required></textarea><label for="back">Rückseite</label><textarea id="back" placeholder="nǐ hǎo&#10;Hallo" required></textarea><button class="primary wide" type="submit">Karte speichern</button><button id="cancel" type="button" class="wide" hidden>Abbrechen</button></form></section><section id="all" hidden><h2>Sammlung</h2><div id="items"></div><h3>Datensicherung</h3><div class="actions"><button id="export">Exportieren</button><button id="import">Importieren</button></div><input type="file" id="file" accept=".json,application/json" hidden><p class="small">Deine Karten bleiben auf diesem Gerät. Sichere sie regelmäßig als JSON-Datei.</p></section></main><nav aria-label="Navigation"><button data-tab="learn" class="active" aria-current="page" aria-label="Lernen" title="Lernen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></button><button data-tab="add" aria-label="Erstellen" title="Erstellen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button><button data-tab="all" aria-label="Sammlung" title="Sammlung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="7" width="14" height="14" rx="2"/><path d="M16 3H6a3 3 0 0 0-3 3v10"/></svg></button></nav><script>
'use strict';const $=id=>document.getElementById(id),key='hanzi-cards-v1';let cards=[],order=[],pos=0,flipped=false,random=false,editing=null;const seed=[{front:'你好',back:'nǐ hǎo\nHallo'},{front:'学习',back:'xuéxí\nlernen'},{front:'多少钱',back:'duōshao qián\nWie viel kostet es?'}];try{const raw=localStorage.getItem(key);cards=raw===null?seed:JSON.parse(raw);if(!Array.isArray(cards))throw Error();}catch(e){cards=[];$('status').textContent='Speicher konnte nicht gelesen werden.'}function save(){try{localStorage.setItem(key,JSON.stringify(cards));$('status').textContent='';return true}catch(e){$('status').textContent='Speichern fehlgeschlagen. Bitte exportiere deine Karten.';return false}}function sequence(){const next=cards.map((_,i)=>i);if(random){for(let i=next.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[next[i],next[j]]=[next[j],next[i]]}}return next}
function reset(){order=sequence();pos=0;flipped=false}
function fitWord(){const card=$('card'),word=$('word');if(!card.clientWidth||!card.clientHeight)return;const width=card.clientWidth-24,height=card.clientHeight-32;const chars=Array.from(word.textContent.replace(/\s/g,''));const han=chars.filter(c=>/\p{Script=Han}/u.test(c)).length;const large=!flipped&&han>0&&han>=chars.length*.65;let size=large?Math.min(width/(Math.min(3,Math.max(1,chars.length))*.98),height*.73,350):Math.min(width*.16,height*.28,68);size=Math.max(12,Math.floor(size));card.style.setProperty('--word-size',size+'px');while(size>12&&(word.scrollHeight>height||word.scrollWidth>width)){size=Math.max(12,Math.floor(size*.91));card.style.setProperty('--word-size',size+'px')}}
function render(){const c=cards[order[pos]],has=!!c;$('progress').textContent=has?`${pos+1} / ${order.length}`:'Noch keine Lernkarten.';$('empty').hidden=has;for(const id of ['stage','hint','shuffle'])$(id).hidden=!has;$('shuffle').setAttribute('aria-pressed',String(random));if(has){$('word').textContent=flipped?c.back:c.front;$('word').lang=flipped?'de':'zh';$('card').classList.toggle('is-back',flipped);$('card').setAttribute('aria-label',(flipped?'Rückseite: ':'Vorderseite: ')+$('word').textContent+' – Karte umdrehen');fitWord()}}
function show(tab){document.body.classList.toggle('learning',tab==='learn');for(const id of ['learn','add','all'])$(id).hidden=id!==tab;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(tab==='all')list();if(tab==='learn')render()}
function clearForm(){editing=null;$('form').reset();$('formtitle').textContent='Neue Lernkarte';$('cancel').hidden=true}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(busy)return;if(b.dataset.tab==='add')clearForm();show(b.dataset.tab)});$('empty').onclick=()=>{clearForm();show('add')};const cardEl=$('card'),feedback=$('feedback');let gesture=null,busy=false,suppressClick=false,sessionResults=new Map();
function nextCard(){if(pos+1<order.length)pos++;else{const previous=order[pos];order=sequence();if(random&&order.length>1&&order[0]===previous)[order[0],order[1]]=[order[1],order[0]];pos=0;sessionResults.clear()}flipped=false;render()}
function clearDrag(){cardEl.style.transition='';cardEl.style.transform='';cardEl.style.opacity=''}
function grade(correct){if(busy||!order.length||$('learn').hidden)return;busy=true;sessionResults.set(order[pos],correct);$('result').textContent=correct?'Richtig':'Falsch';feedback.className='feedback '+(correct?'correct':'incorrect');$('feedback-path').setAttribute('d',correct?'M30 60l20 20 40-40':'M38 38l44 44M82 38L38 82');void feedback.offsetWidth;feedback.classList.add('flash');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;cardEl.style.transition=reduce?'none':'transform .18s ease-out, opacity .18s ease-out';if(!reduce)cardEl.style.transform=`translate3d(${correct?-90:90}px,0,0)`;cardEl.style.opacity='.12';setTimeout(()=>{clearDrag();nextCard()},180);setTimeout(()=>{feedback.className='feedback';busy=false},290)}
cardEl.addEventListener('pointerdown',e=>{if(busy||!e.isPrimary||e.button!==0)return;suppressClick=false;gesture={id:e.pointerId,x:e.clientX,y:e.clientY};cardEl.setPointerCapture(e.pointerId);cardEl.style.transition='none'});
cardEl.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>7){cardEl.style.transform=`translate3d(${dx*.45}px,0,0) rotate(${Math.max(-5,Math.min(5,dx*.025))}deg)`;cardEl.style.opacity=String(Math.max(.55,1-Math.abs(dx)/700))}});
cardEl.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>=Math.min(65,cardEl.clientWidth*.18)&&Math.abs(dx)>Math.abs(dy)*1.15){suppressClick=true;grade(dx<0)}else{clearDrag();if(Math.hypot(dx,dy)>12)suppressClick=true}});
function cancelGesture(){if(gesture){gesture=null;suppressClick=true;clearDrag()}}cardEl.addEventListener('pointercancel',cancelGesture);cardEl.addEventListener('lostpointercapture',cancelGesture);
cardEl.onclick=e=>{if(busy||(suppressClick&&e.detail!==0)){suppressClick=false;return}flipped=!flipped;render()};cardEl.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();grade(e.key==='ArrowLeft')}});
$('shuffle').onclick=()=>{if(busy)return;random=!random;sessionResults.clear();reset();render()};window.addEventListener('resize',fitWord);if('ResizeObserver' in window)new ResizeObserver(fitWord).observe($('stage'));
$('form').onsubmit=e=>{e.preventDefault();const front=$('front').value.trim(),back=$('back').value.trim();if(!front||!back)return;const i=editing===null?cards.length:editing;cards[i]={front,back};save();reset();pos=order.indexOf(i);clearForm();show('learn')};$('cancel').onclick=()=>{clearForm();show('all')};function list(){const parent=$('items');parent.replaceChildren();if(!cards.length){parent.textContent='Noch keine Karten.';return}cards.forEach((c,i)=>{const el=document.createElement('div');el.className='item';const f=document.createElement('strong'),b=document.createElement('p'),edit=document.createElement('button'),del=document.createElement('button');f.textContent=c.front;b.textContent=c.back;edit.textContent='Bearbeiten';del.textContent='Löschen';edit.onclick=()=>{editing=i;$('front').value=c.front;$('back').value=c.back;$('formtitle').textContent='Karte bearbeiten';$('cancel').hidden=false;show('add')};del.onclick=()=>{if(confirm('Diese Karte löschen?')){cards.splice(i,1);save();reset();list()}};el.append(f,b,edit,del);parent.append(el)})} $('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='hanzi-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(c=>c&&typeof c.front==='string'&&typeof c.back==='string'&&c.front.trim()&&c.back.trim()))throw Error();if(confirm(`${data.length} Karten zur Sammlung hinzufügen?`)){cards.push(...data.map(c=>({front:c.front,back:c.back})));save();reset();list()}}catch(e){alert('Ungültige Backup-Datei.')}finally{$('file').value=''}};reset();show('learn');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
