<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f2"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Hanzi – Vokabeltrainer</title><style>
:root{color-scheme:light dark;--bg:#faf7f2;--paper:#fff;--ink:#25241f;--muted:#706c65;--line:#e6e0d8;--accent:#a83f33;--on:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.logo{background:var(--accent);color:white;border-radius:14px;padding:8px 13px;font-size:27px}h1{font-size:25px;margin:0}p{color:var(--muted);line-height:1.5;margin:6px 0 14px}nav,.actions{display:flex;gap:8px;margin:14px 0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--paper);color:var(--ink);min-height:44px}button:disabled{opacity:.45;cursor:default}nav button,.actions button{flex:1}button.active,button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}.card{width:100%;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 14px;overflow-wrap:anywhere}.card span{color:var(--muted);font-size:13px}.card strong{font-size:clamp(24px,7vw,42px);white-space:pre-wrap;font-weight:500;line-height:1.4}textarea{width:100%;resize:vertical;min-height:100px;padding:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;margin:8px 0 16px}label{display:block;font-weight:600}.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.item strong,.item p{white-space:pre-wrap}.item button{margin-right:8px}.small{font-size:13px;color:var(--muted)}.wide{width:100%}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#171716;--paper:#222221;--ink:#f5f1e9;--muted:#b8b2a8;--line:#3b3936;--accent:#b84e41}}
</style></head><body><main><header><div class="logo" lang="zh">汉</div><div><h1>Hanzi</h1><div class="small">Dein persönlicher Vokabeltrainer</div></div></header><nav aria-label="Navigation"><button data-tab="learn" class="active">Lernen</button><button data-tab="add">Erstellen</button><button data-tab="all">Sammlung</button></nav><div id="status" role="status" class="small"></div><section id="learn"><p id="progress"></p><button id="card" class="card"><span id="side"></span><strong id="word"></strong><span>Antippen zum Umdrehen</span></button><div class="actions"><button id="prev">← Zurück</button><button id="next" class="primary">Weiter →</button></div><div class="actions"><button id="shuffle">Mischen</button><button id="reverse">Richtung wechseln</button></div><p id="direction" class="small"></p><button id="empty" class="primary wide" hidden>Erste Karte erstellen</button></section><section id="add" hidden><h2 id="formtitle">Neue Lernkarte</h2><form id="form"><label for="front">Vorderseite</label><textarea id="front" placeholder="你好" required></textarea><label for="back">Rückseite</label><textarea id="back" placeholder="nǐ hǎo&#10;Hallo" required></textarea><button class="primary wide" type="submit">Karte speichern</button><button id="cancel" type="button" class="wide" hidden>Abbrechen</button></form></section><section id="all" hidden><h2>Sammlung</h2><div id="items"></div><h3>Datensicherung</h3><div class="actions"><button id="export">Exportieren</button><button id="import">Importieren</button></div><input type="file" id="file" accept=".json,application/json" hidden><p class="small">Deine Karten bleiben auf diesem Gerät. Sichere sie regelmäßig als JSON-Datei.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),key='hanzi-cards-v1';let cards=[],order=[],pos=0,flipped=false,reversed=false,editing=null;const seed=[{front:'你好',back:'nǐ hǎo\nHallo'},{front:'学习',back:'xuéxí\nlernen'},{front:'多少钱',back:'duōshao qián\nWie viel kostet es?'}];try{const raw=localStorage.getItem(key);cards=raw===null?seed:JSON.parse(raw);if(!Array.isArray(cards))throw Error();}catch(e){cards=[];$('status').textContent='Speicher konnte nicht gelesen werden.'}function save(){try{localStorage.setItem(key,JSON.stringify(cards));$('status').textContent='';return true}catch(e){$('status').textContent='Speichern fehlgeschlagen. Bitte exportiere deine Karten.';return false}}function reset(){order=cards.map((_,i)=>i);pos=0;flipped=false}function render(){const c=cards[order[pos]],has=!!c;$('progress').textContent=has?`Karte ${pos+1} von ${order.length}`:'Noch keine Lernkarten.';$('empty').hidden=has;for(const id of ['card','prev','next','shuffle','reverse'])$(id).hidden=!has;if(has){const back=flipped!==reversed;$('side').textContent=back?'Rückseite':'Vorderseite';$('word').textContent=back?c.back:c.front;}$('direction').textContent=has?(reversed?'Rückseite → Vorderseite':'Vorderseite → Rückseite'):''}function show(tab){for(const id of ['learn','add','all'])$(id).hidden=id!==tab;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});if(tab==='all')list();if(tab==='learn')render()}function clearForm(){editing=null;$('form').reset();$('formtitle').textContent='Neue Lernkarte';$('cancel').hidden=true}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='add')clearForm();show(b.dataset.tab)});$('empty').onclick=()=>{clearForm();show('add')};$('card').onclick=()=>{flipped=!flipped;render()};function move(n){if(order.length){pos=(pos+n+order.length)%order.length;flipped=false;render()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reverse').onclick=()=>{reversed=!reversed;flipped=false;render()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;flipped=false;render()};$('form').onsubmit=e=>{e.preventDefault();const front=$('front').value.trim(),back=$('back').value.trim();if(!front||!back)return;const i=editing===null?cards.length:editing;cards[i]={front,back};save();reset();pos=i;clearForm();show('learn')};$('cancel').onclick=()=>{clearForm();show('all')};function list(){const parent=$('items');parent.replaceChildren();if(!cards.length){parent.textContent='Noch keine Karten.';return}cards.forEach((c,i)=>{const el=document.createElement('div');el.className='item';const f=document.createElement('strong'),b=document.createElement('p'),edit=document.createElement('button'),del=document.createElement('button');f.textContent=c.front;b.textContent=c.back;edit.textContent='Bearbeiten';del.textContent='Löschen';edit.onclick=()=>{editing=i;$('front').value=c.front;$('back').value=c.back;$('formtitle').textContent='Karte bearbeiten';$('cancel').hidden=false;show('add')};del.onclick=()=>{if(confirm('Diese Karte löschen?')){cards.splice(i,1);save();reset();list()}};el.append(f,b,edit,del);parent.append(el)})} $('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='hanzi-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(c=>c&&typeof c.front==='string'&&typeof c.back==='string'&&c.front.trim()&&c.back.trim()))throw Error();if(confirm(`${data.length} Karten zur Sammlung hinzufügen?`)){cards.push(...data.map(c=>({front:c.front,back:c.back})));save();reset();list()}}catch(e){alert('Ungültige Backup-Datei.')}finally{$('file').value=''}};reset();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
